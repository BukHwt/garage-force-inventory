name: inventory-public-review
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: public_demo
      POSTGRES_PASSWORD: public_demo_only
      POSTGRES_DB: inventory_public_demo
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - inventory-public-review-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U public_demo -d inventory_public_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inventory-public-review-db:
